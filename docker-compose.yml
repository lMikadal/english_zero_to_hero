services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ezh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ezh}
      POSTGRES_DB: ${POSTGRES_DB:-english_zero_to_hero}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ezh} -d ${POSTGRES_DB:-english_zero_to_hero}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    # uid/gid 1000 = host user, so files written into the bind mount are not root-owned
    user: "1000:1000"
    environment:
      # dev uses its own database (<POSTGRES_DB>_dev); the real `english_zero_to_hero` is reserved
      # for production and `make db-reset` refuses anything not ending in _dev
      DATABASE_URL: postgres://${POSTGRES_USER:-ezh}:${POSTGRES_PASSWORD:-ezh}@postgres:5432/${POSTGRES_DB:-english_zero_to_hero}_dev
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # any HTTP response means the dev server is up; /api/health touches no database (`/` would seed the learner every 5 s)
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 5s
      timeout: 30s
      retries: 30
      # the first start runs a full pnpm install, which can be slow on a bad network
      start_period: 300s

  # Playwright. Started only by `make e2e`, which first starts a PRODUCTION build of the app as the throwaway project
  # ezh_e2e (docker-compose.prod.yml + docker-compose.e2e-prod.yml, its own database english_zero_to_hero_e2e), so the
  # dev server (Fast Refresh, on-demand compilation) is never in the E2E path. The browser container shares the host's
  # network: it reaches the app at 127.0.0.1 through the published port, exactly like a request from this machine,
  # and the stack's postgres on 127.0.0.1 (published on loopback only, for this project only).
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    user: "1000:1000"
    network_mode: host
    # Chromium needs more shared memory than Docker's 64 MB default
    shm_size: "1gb"
    working_dir: /app
    environment:
      HOME: /tmp
      # both set by `make e2e`. No `:?` (compose would then refuse every command, for every service); the database URL has
      # no default on purpose, so a bare `docker compose run e2e` cannot guess a target (due.ts then refuses to run)
      BASE_URL: ${E2E_BASE_URL:-http://127.0.0.1:3196}
      # Only e2e/helpers/due.ts reads this (to make review cards due, see docs/TESTING.md). The helper refuses any
      # database whose name does not end in _dev or _e2e, so the real english_zero_to_hero cannot be hit.
      E2E_DATABASE_URL: ${E2E_DATABASE_URL:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["node_modules/.bin/playwright", "test"]

volumes:
  pgdata:
  node_modules:
  next_cache:
