# CI = the same Docker path as local development: the jobs call the project's own Makefile
# (docker compose + Dockerfile), they do not set up Node/pnpm on the runner. Nothing here
# needs secrets.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# cancel superseded runs on the same PR; never cancel runs on main
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # fixed compose project name, so the image we build below is named `ezh-app`, which is exactly
  # what `docker compose` looks for (<project>-<service>) and therefore does not rebuild it
  COMPOSE_PROJECT_NAME: ezh

jobs:
  check:
    name: check (lint, typecheck, test, validate, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The app container runs as uid/gid 1000 (compose `user:`) and writes into the bind-mounted
      # workspace (next-env.d.ts, tsconfig.tsbuildinfo, coverage, drizzle output, node_modules and
      # .next mount points). The runner user is uid 1001 and owns the checkout, so those writes
      # would fail with EACCES. chown (not chmod a+w: that would show up as mode changes in git)
      # and tell git the directory is fine to read as a different user.
      - name: Make the workspace writable for uid 1000
        run: |
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: docker/setup-buildx-action@v3

      # Layer cache only (keyed by Docker on the Dockerfile contents, so it cannot go stale).
      # `load: true` puts the image in the local daemon so `make` finds it and skips building.
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: ezh-app:latest
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max

      # First `make` call runs `pnpm install` inside dev-entrypoint.sh into the (empty) node_modules
      # volume; later calls reuse the volume and skip the install via the stamp file.
      - name: make check
        run: make check

      # Warnings do not fail the check; show them to reviewers of content PRs.
      - name: Content validator report in the job summary
        if: always()
        run: if [ -f .content-validate-summary.md ]; then cat .content-validate-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Migrations apply to a fresh database
        run: make db-migrate

      - name: Migrations are in sync with the schema
        run: |
          make db-generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::src/db/schema.ts and the committed migrations are out of sync. Run 'make db-generate' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

      - name: App and postgres logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=200 || true

      # give the workspace back to the runner user so the checkout post-step can clean up
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

  # Playwright E2E at 360px, against a PRODUCTION build (the real image) in a throwaway stack: `make e2e` starts it as the
  # project ezh_e2e with its own database, runs Playwright in the mcr.microsoft.com/playwright container and removes the
  # stack. The dev server (Fast Refresh, on-demand compilation) is not in this path. First seen green on CI on 2026-11-25
  # (PR #9); it blocks merging. The developer machine cannot pull the Playwright image, so CI is where E2E runs.
  e2e:
    name: e2e (Playwright, 360px)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # NOT `chown -R` of the whole workspace like the check job: `make e2e` itself writes into the workspace as the runner
      # user (.env.e2e, backups-e2e/, e2e-server.log) and that would fail with "Permission denied". The only container that
      # writes into the bind mount is Playwright (uid 1000): its report and traces, so only those two folders are handed over.
      - name: Make the Playwright output folders writable for uid 1000
        run: |
          mkdir -p test-results playwright-report
          sudo chown 1000:1000 test-results playwright-report
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: docker/setup-buildx-action@v3

      # the dev image only provides node_modules for the Playwright container (the app itself is the production image below)
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: ezh-app:latest
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max

      # The tag the Makefile derives for project ezh_e2e, so `make e2e E2E_BUILD=0` starts it without rebuilding. Same layer
      # cache as the prod-image job (read only here): when that job has already written it, this is a cache hit; the two
      # jobs start together, so on a cold cache this build pays for the full image itself (about a minute).
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          load: true
          tags: ezh-e2e-app:latest
          cache-from: type=gha,scope=prod-image

      - name: make e2e
        run: make e2e E2E_BUILD=0

      # `make e2e` removes its stack at the end, so on failure it first saves the server log of the run here
      - name: Upload Playwright report, traces and the app's server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the E2E stack (if the run was cut short)
        if: always()
        run: make e2e-down || true

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

  # A broken production build (next build, the Dockerfile prod stage, the migrate bundle, missing content/) must never
  # merge: build the real prod image, start it with a throwaway postgres (random password, own project, torn down at
  # the end) and GET the main pages. Nothing here is the user's real database.
  prod-image:
    name: prod image (build, start, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # The job runs the production stack as the throwaway project `ezh_ci` (own image tag, database, port, backups-ci/),
      # never as the real project: the round trip below writes marker rows and replaces data, which must be impossible for the
      # real app. `load: true` + the tag the Makefile derives for project ezh_ci: `make ci-up` then starts it without rebuilding
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          load: true
          tags: ezh-ci-app:latest
          cache-from: type=gha,scope=prod-image
          cache-to: type=gha,scope=prod-image,mode=max

      - name: Start the production stack (migrations run first)
        run: |
          make ci-init
          # the device allow-list is ON in CI: the smoke test and the round trip below must still pass (the host itself is always
          # allowed), and the access step after them proves the peer stamp still works (see scripts/prod/access-check.sh)
          sed -i 's/^ALLOWED_IPS=.*/ALLOWED_IPS=100.101.102.103, 100.64.0.0\/10/' .env.ci
          make ci-up

      - name: Smoke test
        run: sh scripts/prod/smoke.sh http://127.0.0.1:3195

      # A Next.js upgrade that silently breaks the peer stamp (src/lib/access/peer-stamp.ts) would either lock everyone out
      # (host request without X-Forwarded-For -> 403) or let forged headers in. Both fail this step, so it is noticed.
      - name: Device allow-list is enforced (listed 200, unlisted 403 on pages/API/static, forged peer header 403)
        run: PROBE_GATEWAY=172.30.30.1 PROBE_EXEC="docker compose -p ezh_ci -f docker-compose.prod.yml --env-file .env.ci exec -T postgres" sh scripts/prod/access-check.sh http://127.0.0.1:3195 "$(sh scripts/prod/env-get.sh .env.ci ALLOWED_IPS)"

      # backup -> change -> restore with the real make targets and a marker row, so a restore that does nothing (or a
      # refusal that does not happen) fails the job; the pg_dump / pg_restore flags run on every PR
      - name: Backup, change, restore round trip (with marker)
        run: make ci-roundtrip

      - name: Production logs (on failure)
        if: failure()
        run: docker compose -p ezh_ci -f docker-compose.prod.yml --env-file .env.ci logs --no-color --tail=200 || true

      - name: Tear down
        if: always()
        run: make ci-down || true
